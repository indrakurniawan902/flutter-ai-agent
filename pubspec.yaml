name: flutter_ai_agent
description: "Mobile AI Agent workstation with device tool calling."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Network
  dio: ^5.8.0

  # Local storage
  hive_ce: ^2.19.0
  hive_ce_flutter: ^1.2.0
  flutter_secure_storage: ^9.2.4

  # Functional
  dartz: ^0.10.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0

  # Device tools
  battery_plus: ^7.1.1
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.3.1
  package_info_plus: ^9.0.1
  image_picker: ^1.1.2
  device_calendar: ^4.3.3
  timezone: ^0.9.4
  flutter_local_notifications: ^18.0.1

  # UI / Markdown
  flutter_markdown: ^0.7.4

  # QR Scanner
  mobile_scanner: ^6.0.2
  google_fonts: ^8.2.1
  go_router: ^14.6.1

  # Fase 6 — OS integration
  yaml: ^3.1.2
  receive_sharing_intent: ^1.9.0
  quick_actions: ^1.1.1
  contacts_service: ^0.6.3
  url_launcher: ^6.3.2

  # Fase 3 Local Intelligence
  file_picker: ^11.0.3
  syncfusion_flutter_pdf: ^34.2.7
  sqflite: ^2.4.4
  workmanager: ^0.10.10

  # Voice & audio
  speech_to_text: ^7.4.0
  audioplayers: ^6.8.1
  permission_handler: ^13.0.2
  pdf: ^3.13.0
  archive: ^4.0.9
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  injectable_generator: ^2.4.1
  build_runner: ^2.4.13
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
